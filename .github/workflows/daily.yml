name: Daily funding pipeline

# 매일 수집→추출→저장 후 GitHub Pages 배포
on:
  schedule:
    - cron: "0 22 * * *"   # 매일 UTC 22:00 = 한국시간 아침 7시
  workflow_dispatch: {}     # 수동 실행 허용

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  # 수집·추출·저장과 사이트 아티팩트 업로드까지. 배포는 다음 잡에서 한다.
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 추출이 일부라도 막히면 pipeline.py 가 1로 끝난다(= 이 잡이 빨간불).
      # 그래야 딜이 안 들어오는 것을 그날 알 수 있다.
      - name: Run pipeline (collect → extract → store → export)
        id: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline.py

      # 위가 실패해도 거기까지 얻은 결과는 남긴다. 안 그러면 성공한 딜까지 버려지고,
      # 다음 실행이 같은 기사를 또 긁는다.
      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/funding.db public/data
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음 - 커밋 생략"
          else
            git commit -m "chore: daily data update $(date -u +%Y-%m-%d)"
            git push
          fi

      # 파이프라인이 일부 실패해도 거기까지 만들어진 사이트는 올린다.
      - name: Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        if: always()
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  # 배포를 따로 떼어 둔 이유 (actions/deploy-pages#451)
  #
  # 업로드와 배포가 같은 잡에 있으면, 방금 확정된 아티팩트를 조회할 때
  # 간헐적으로 0건이 돌아와 "No artifacts named github-pages were found" 로 죽는다.
  # 우리 로그에서도 확정→조회 간격이 짧은 쪽만 실패했다:
  #   실패 262ms -> Found 0 artifact(s)
  #   성공 427ms -> Found 1 artifact(s)
  # 재실행으로는 못 고친다. 아티팩트가 둘이 되어 이번엔 "Multiple artifacts" 로 죽는다.
  # 잡을 나누면 조회가 몇 초 뒤에 일어나 경쟁이 사라진다. GitHub 의 다른 Pages
  # 템플릿들이 모두 이 구조다(한 잡에 몰아넣은 건 static 템플릿뿐이고, 그게 이 버그를 탄다).
  deploy:
    needs: pipeline
    if: ${{ !cancelled() }}   # 파이프라인이 빨간불이어도 사이트는 올린다
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
